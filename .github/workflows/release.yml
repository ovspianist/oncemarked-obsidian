name: Release plugin

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (manifest.version !== process.env.RELEASE_TAG || pkg.version !== manifest.version)
              throw new Error("Tag, manifest and package versions must match");
          '
      - run: pnpm verify
      - name: Attest installable assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --verify-tag --title "$RELEASE_TAG" --generate-notes
